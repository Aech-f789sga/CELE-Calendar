
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 192px;
      height: 192px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    svg {
      width: 192px;
      height: 192px;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with smooth squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="#27272a" stroke-width="8"/>
  
  <!-- Soft subtle ambient glow -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Dial Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#27272a" stroke-width="12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="660" stroke-dashoffset="180" />

  <!-- Center Clock & Sparkle Accent -->
  <circle cx="256" cy="256" r="14" fill="#34d399" />
  
  <!-- Minimalist Clock Hands -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#f4f4f5" stroke-width="14" stroke-linecap="round" />
  <line x1="256" y1="256" x2="330" y2="256" stroke="#34d399" stroke-width="12" stroke-linecap="round" />

  <!-- Four minimalist tick marks -->
  <circle cx="256" cy="132" r="5" fill="#71717a" />
  <circle cx="380" cy="256" r="5" fill="#71717a" />
  <circle cx="256" cy="380" r="5" fill="#71717a" />
  <circle cx="132" cy="256" r="5" fill="#71717a" />
</svg>

</body>
</html>
